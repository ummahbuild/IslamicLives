name: Feature request
description: Propose a focused product, accessibility, tooling, or documentation improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What reader or contributor problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not only an implementation choice.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - Web
        - Expo / iOS
        - Expo / Android
        - Content pipeline
        - Documentation
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility and evidence considerations
      description: Note keyboard, screen-reader, reduced-motion, source, or uncertainty effects.
